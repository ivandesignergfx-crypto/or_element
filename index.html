<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ØR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" type="image/png" sizes="64x64" href="link/faviconnnn.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Dancing+Script:wght@400..700&family=Fjalla+One&family=Kapakana:wght@300..400&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>

:root{
  --marfil:        #F6F2EA;
  --carbon:         #1D1A18;
  --tierra:         #5B4A3D;
  --lava:           #7F261A;
  --cobre:          #B56A3C;
  --piedra:         #8A847D;
  --bg:             #362A22;   /* fondo cálido oscuro, entre tierra y carbón */
  --bg-deep:        #221A15;

  --font-display: 'Space Grotesk', sans-serif;
  --font-serif:   'EB Garamond', serif;

  --dur: 700ms;
  --ease: cubic-bezier(.65,0,.35,1);
}

*{ margin:0; padding:0; box-sizing:border-box; }

html, body{
  height: 100%;
  min-height: 100%;
  background: var(--bg-deep);
}

body{
  background: radial-gradient(120% 90% at 50% 30%, var(--bg) 0%, var(--bg-deep) 100%);
  color: var(--marfil);
  font-family: var(--font-display);
  overflow: hidden;
  position: fixed;
  inset: 0;
  width: 100%;
  -webkit-font-smoothing: antialiased;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ---------- textura de grano sutil ---------- */
.grain{
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 3;
  opacity: .05;
  mix-blend-mode: overlay;
  background-image:
    repeating-radial-gradient(circle at 20% 30%, #fff 0, transparent 1px),
    repeating-radial-gradient(circle at 70% 60%, #fff 0, transparent 1px);
  background-size: 3px 3px, 4px 4px;
}

/* ---------- resplandor tipo brasa / forja ---------- */
.ember{
  position: fixed;
  z-index: 0;
  top: 50%;
  left: 50%;
  width: 60vmax;
  height: 60vmax;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(127,38,26,.35) 0%, rgba(181,106,60,.12) 35%, transparent 70%);
  filter: blur(10px);
  animation: pulse 6s ease-in-out infinite;
  pointer-events: none;
}

@keyframes pulse{
  0%, 100%{ opacity: .55; transform: translate(-50%,-50%) scale(1); }
  50%{      opacity: .85; transform: translate(-50%,-50%) scale(1.06); }
}

/* ---------- escenario ---------- */
.stage{
  position: absolute;
  inset: 0;
  z-index: 2;
  height: 100%;
  width: 100%;
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: 1fr;
}

.scene{
  grid-area: 1 / 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(2rem, 5vw, 3rem);
  padding: 2rem;
  text-align: center;
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease), filter var(--dur) var(--ease);
}

/* Escena 1: puerta / logo */
.scene--gate{
  opacity: 1;
  transform: translateY(0) scale(1);
  filter: blur(0);
}

.stage.is-open .scene--gate{
  opacity: 0;
  transform: translateY(-2.2rem) scale(.96);
  filter: blur(6px);
  pointer-events: none;
}

.logo{
  width: clamp(180px, 30vw, 320px);
  height: auto;
  user-select: none;
}

.btn{
  appearance: none;
  border: 1px solid rgba(246,242,234,.55);
  background: transparent;
  color: var(--marfil);
  font-family: var(--font-display);
  font-size: .85rem;
  letter-spacing: .28em;
  text-transform: uppercase;
  padding: 1rem 2.6rem;
  cursor: pointer;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease), letter-spacing var(--dur) var(--ease);
}

.btn:hover,
.btn:focus-visible{
  background: var(--marfil);
  color: var(--carbon);
  border-color: var(--marfil);
  letter-spacing: .34em;
}

.btn:focus-visible{ outline: 2px solid var(--cobre); outline-offset: 4px; }

/* Escena 2: en construcción */
.scene--build{
  opacity: 0;
  transform: translateY(2.2rem) scale(1.02);
  filter: blur(6px);
  pointer-events: none;
}

.stage.is-open .scene--build{
  opacity: 1;
  transform: translateY(0) scale(1);
  filter: blur(0);
  pointer-events: auto;
  transition-delay: 120ms;
}

.eyebrow{
  font-size: 4rem;
  letter-spacing: .3em;
  color: var(--cobre);
  text-transform: uppercase;
}

.eyebrow-logo{
  width: clamp(50px, 15vw, 100px);
  height: auto;
  user-select: none;
  
}

.build-subtitle{
  font-size: 2rem;

  word-spacing: .4em;
}

.socials{
  list-style: none;
  display: flex;
  align-items: center;
  gap: 1.8rem;
  margin-top: .5rem;
}

.socials a{
  display: flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid rgba(246,242,234,.3);
  color: var(--piedra);
  transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
}

.socials svg{
  width: 18px;
  height: 18px;
}

.socials a:hover,
.socials a:focus-visible{
  color: var(--cobre);
  border-color: var(--cobre);
  transform: translateY(-2px);
}

.btn-back{
  appearance: none;
  background: none;
  border: none;
  color: var(--piedra);
  font-family: var(--font-display);
  font-size: .75rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  cursor: pointer;
  margin-top: 1.5rem;
  transition: color var(--dur) var(--ease);
}

.btn-back:hover,
.btn-back:focus-visible{ color: var(--marfil); }


/* ---------- responsive ---------- */
@media (max-width: 480px){
  .socials{ flex-direction: row; justify-content: center; gap: 1.2rem; flex-wrap: nowrap; }
  .signature{ font-size: .7rem; }
}
</style>
</head>
<body>

  <div class="grain"></div>
  <div class="ember"></div>

  <main class="stage" id="stage">

    <!-- ESCENA 1 — Portada -->
    <section class="scene scene--gate" id="scene-gate">
      <img class="logo" src="link/logo.png" alt="ØR">

      <button class="btn" id="btnAcceder" type="button">
        <span>Acceder</span>
      </button>
    </section>

    <!-- ESCENA 2 — En construcción -->
    <section class="scene scene--build" id="scene-build" aria-hidden="true">
      <img class="eyebrow-logo" src="link/logo1.png" alt="ØR">
      
      <p class="build-subtitle">FORJANDO EL FUTURO</p>

      <ul class="socials">
        <li>
          <a href="https://instagram.com/or_element" target="_blank" rel="noopener" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <rect x="2.5" y="2.5" width="19" height="19" rx="5"/>
              <circle cx="12" cy="12" r="4.3"/>
              <circle cx="17.4" cy="6.6" r="1.05" fill="currentColor" stroke="none"/>
            </svg>
          </a>
        </li>
        <li>
          <a href="https://www.tiktok.com/@or_element" target="_blank" rel="noopener" aria-label="TikTok">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M16.6 2h-3.2v13.6a3.1 3.1 0 1 1-2.2-2.97V9.3a6.3 6.3 0 1 0 5.4 6.24V8.9a7.5 7.5 0 0 0 4.4 1.4V7.1a4.3 4.3 0 0 1-4.4-3.63V2Z"/>
            </svg>
          </a>
        </li>
        <li>
          <a href="mailto:hola@or-studio.com" aria-label="Correo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/>
              <path d="M3.5 6.5 12 13l8.5-6.5"/>
            </svg>
          </a>
        </li>
      </ul>

      <button class="btn-back" id="btnVolver" type="button">← Volver</button>
    </section>

  </main>

<script>
  const btnAcceder = document.getElementById('btnAcceder');
  const btnVolver  = document.getElementById('btnVolver');
  const stage      = document.getElementById('stage');
  const sceneGate  = document.getElementById('scene-gate');
  const sceneBuild = document.getElementById('scene-build');

  btnAcceder.addEventListener('click', () => {
    stage.classList.add('is-open');
    sceneBuild.setAttribute('aria-hidden', 'false');
    sceneGate.setAttribute('aria-hidden', 'true');
  });

  btnVolver.addEventListener('click', () => {
    stage.classList.remove('is-open');
    sceneBuild.setAttribute('aria-hidden', 'true');
    sceneGate.setAttribute('aria-hidden', 'false');
  });
</script>

</body>
</html>
